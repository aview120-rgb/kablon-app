name: Safa – create Google Play upload key (run ONCE)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Generate keystore with a random password
        run: |
          mkdir out
          PASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          keytool -genkeypair -v -keystore out/safa-upload.jks -alias safa -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Safa, O=Safa, C=IL" >/dev/null 2>&1
          base64 -w0 out/safa-upload.jks > out/ANDROID_KEYSTORE_BASE64.txt
          {
            echo "Add these 4 repository secrets (Settings > Secrets and variables > Actions > New repository secret):"
            echo "ANDROID_KEYSTORE_BASE64 = (the whole content of ANDROID_KEYSTORE_BASE64.txt)"
            echo "ANDROID_KEYSTORE_PASSWORD = $PASS"
            echo "ANDROID_KEY_ALIAS = safa"
            echo "ANDROID_KEY_PASSWORD = $PASS"
            echo ""
            echo "KEEP safa-upload.jks AND THIS FILE SAFE (e.g. Google Drive). Then delete this workflow run."
          } > out/READ-ME-SECRETS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: safa-upload-key-DOWNLOAD-AND-DELETE
          path: out/
          retention-days: 1
