name: Safa – build Android app (Google Play)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version code (a whole number, +1 for every Play upload)'
        required: true
        default: '1'
      version_name:
        description: 'Version name shown to users'
        required: true
        default: '1.0.0'
  push:
    paths: ['english-app/**', '.github/workflows/safa-android.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: english-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: english-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build web app and copy into Android project
        run: npm run android:sync
      - name: Prepare signing key (from repository secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret – building an UNSIGNED bundle (fine for testing, Play needs a signed one). See english-app/docs/GOOGLE-PLAY.md"
          fi
      - name: Build release bundle (.aab) and test APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        working-directory: english-app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleDebug \
            -PversionCode=${{ github.event.inputs.version_code || github.run_number }} \
            -PversionName=${{ github.event.inputs.version_name || '1.0.0' }}
      - uses: actions/upload-artifact@v4
        with:
          name: safa-google-play-bundle
          path: english-app/android/app/build/outputs/bundle/release/*.aab
      - uses: actions/upload-artifact@v4
        with:
          name: safa-test-apk-install-on-phone
          path: english-app/android/app/build/outputs/apk/debug/*.apk
