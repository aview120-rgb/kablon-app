name: לאמא היקרה – website (one-off upload)

# The same app as a website on GitHub Pages. Runs only when started by hand (or when this file changes).
on:
  workflow_dispatch:
  push:
    branches: [claude/file-converter-app-68972l]
    paths:
      - '.github/workflows/lema-website.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lema-website
  cancel-in-progress: false

jobs:
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lema-hayakara
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lema-hayakara/package-lock.json
      - uses: actions/cache@v4
        with:
          path: lema-hayakara/public/fonts
          key: fonts-${{ hashFiles('lema-hayakara/scripts/assets.json') }}
      - uses: actions/cache@v4
        with:
          path: lema-hayakara/public/models
          key: models-${{ hashFiles('lema-hayakara/scripts/assets.json') }}
      - run: npm ci
      - run: npm run assets
      - run: npm run build
      - run: du -sh dist && touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: lema-hayakara/dist
      - id: deploy
        uses: actions/deploy-pages@v4
