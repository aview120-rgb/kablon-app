name: android
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assembleDebug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;37.0.0" "platform-tools"
      - name: Build debug APK and run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AutoAgent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # Direct download link that always points to the newest build from main:
      # https://github.com/<owner>/<repo>/releases/download/autoagent-latest/AutoAgent.apk
      - name: Publish direct-download release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AutoAgent.apk
          gh release delete autoagent-latest --yes --cleanup-tag || true
          gh release create autoagent-latest AutoAgent.apk \
            --target "$GITHUB_SHA" \
            --title "AutoAgent (latest build)" \
            --notes "Latest AutoAgent build from main (${GITHUB_SHA::7}). Install AutoAgent.apk on your phone." \
            --latest
