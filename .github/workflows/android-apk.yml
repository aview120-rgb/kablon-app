name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + unit tests + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # אופציונלי: מפתח חתימה פרטי מ-Secrets (אחרת – המפתח הקבוע שבריפו)
      - name: Prepare signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KABLON_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KABLON_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Using private keystore from secrets"
          fi

      - name: Build, test, lint
        env:
          KABLON_KEYSTORE_PASSWORD: ${{ secrets.KABLON_KEYSTORE_PASSWORD }}
          KABLON_KEY_ALIAS: ${{ secrets.KABLON_KEY_ALIAS }}
          KABLON_KEY_PASSWORD: ${{ secrets.KABLON_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease

      - name: Collect APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/kablon-automation.apk"
          ls -la "$GITHUB_WORKSPACE/kablon-automation.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: kablon-automation-apk
          path: kablon-automation.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore

  smoke-test:
    name: Emulator smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: kablon-automation-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run on emulator (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash android/scripts/smoke-test.sh kablon-automation.apk

  release:
    name: Publish GitHub Release
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kablon-automation-apk

      - name: Name versioned copy
        run: cp kablon-automation.apk "kablon-automation-v1.0.${{ github.run_number }}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kablon Automation v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            APK מוכן להתקנה (נבנה, נבדק ביחידות + lint + אמולטור).
            קישור קבוע לגרסה האחרונה:
            https://github.com/${{ github.repository }}/releases/latest/download/kablon-automation.apk
          files: |
            kablon-automation.apk
            kablon-automation-v1.0.${{ github.run_number }}.apk
