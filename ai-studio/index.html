<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1222">
<title>סטודיו AI</title>
<style>
:root{--bg:#0f1222;--card:#181c33;--line:#2a2f52;--text:#eef0ff;--muted:#9aa0c8;--acc:#7c5cff;--acc2:#00d1b2;--err:#ff5470;--ok:#22c55e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:rgba(15,18,34,.95);backdrop-filter:blur(8px);padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
h1{font-size:20px;margin:0}
.dot{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.dot i{width:10px;height:10px;border-radius:50%;background:var(--err);display:inline-block}
.dot.on i{background:var(--ok)}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 6px}
input,textarea,select{width:100%;background:#0c0f1d;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;font-family:inherit}
textarea{min-height:90px;resize:vertical}
input[type=url]{direction:ltr;text-align:left}
button{border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;color:#fff;background:var(--acc);width:100%}
button.sec{background:#2a2f52}
button.alt{background:var(--acc2);color:#04221d}
button:disabled{opacity:.5}
.row{display:flex;gap:10px}.row>*{flex:1}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{background:#1d2140;color:var(--muted)}
.tabs button.active{background:var(--acc);color:#fff}
.hidden{display:none!important}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{width:auto;padding:10px 14px;background:#1d2140;color:var(--muted);font-weight:500}
.chips button.active{background:var(--acc);color:#fff}
.preview{margin-top:14px;border-radius:14px;overflow:hidden;background:#0c0f1d;text-align:center}
.preview img,.preview video{width:100%;max-height:60vh;object-fit:contain;display:block;margin:0 auto}
.msg{margin-top:12px;padding:12px;border-radius:12px;font-size:14px;line-height:1.5}
.msg.err{background:rgba(255,84,112,.12);color:#ffb3c0;border:1px solid rgba(255,84,112,.4)}
.msg.ok{background:rgba(34,197,94,.12);color:#a7f3c0;border:1px solid rgba(34,197,94,.4)}
.msg.info{background:rgba(124,92,255,.12);color:#d4caff;border:1px solid rgba(124,92,255,.4)}
.bar{height:12px;background:#0c0f1d;border-radius:8px;overflow:hidden;margin-top:12px;border:1px solid var(--line)}
.bar div{height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .4s}
.small{font-size:13px;color:var(--muted)}
.range-val{font-weight:700;color:var(--text)}
input[type=range]{padding:0;accent-color:var(--acc)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted)}
.gap{height:10px}
</style>
</head>
<body>
<header>
  <h1>🎬 סטודיו AI</h1>
  <span id="statusDot" class="dot"><i></i><span id="statusText">מנותק</span></span>
</header>
<main>
  <section class="card">
    <label for="serverUrl">קישור השרת מ-Google Colab</label>
    <input id="serverUrl" type="url" inputmode="url" placeholder="https://xxxx.gradio.live" autocomplete="off">
    <div class="gap"></div>
    <button id="btnCheck" class="sec">🔌 בדוק חיבור</button>
    <div id="connMsg"></div>
  </section>

  <div class="tabs">
    <button id="tabImg" class="active">🖼️ יצירת תמונה</button>
    <button id="tabVid">🎥 סרטון מתמונה</button>
  </div>

  <section id="paneImg" class="card">
    <label for="imgPrompt">תיאור התמונה (עברית או אנגלית)</label>
    <textarea id="imgPrompt" placeholder="לדוגמה: חתול ג'ינג'י יושב על חלון בשקיעה, צילום מקצועי"></textarea>
    <label>יחס תמונה</label>
    <div class="chips" id="aspects">
      <button data-v="1:1" class="active">1:1 ריבוע</button>
      <button data-v="9:16">9:16 סטורי</button>
      <button data-v="16:9">16:9 רחב</button>
      <button data-v="4:5">4:5 פוסט</button>
      <button data-v="3:4">3:4</button>
    </div>
    <div class="gap"></div>
    <button id="btnImg">✨ צור תמונה</button>
    <div id="imgMsg"></div>
    <div id="imgPreview" class="preview hidden"><img id="imgOut" alt="תמונה שנוצרה"></div>
    <div id="imgActions" class="row hidden" style="margin-top:12px">
      <button id="btnImgDl" class="alt">⬇️ הורד לגלריה</button>
      <button id="btnToVideo" class="sec">🎥 הפוך לסרטון</button>
    </div>
  </section>

  <section id="paneVid" class="card hidden">
    <label>תמונת פתיחה</label>
    <input id="fileInput" type="file" accept="image/*" class="hidden">
    <div class="drop" id="dropZone">📷 לחצו לבחירת תמונה מהגלריה</div>
    <div id="vidSrcPreview" class="preview hidden"><img id="vidSrcImg" alt="תמונת פתיחה"></div>
    <label for="vidPrompt">תיאור התנועה</label>
    <textarea id="vidPrompt" placeholder="לדוגמה: המצלמה מתקרבת לאט, השיער זז ברוח"></textarea>
    <label>משך הסרטון: <span id="durVal" class="range-val">5</span> שניות</label>
    <input id="duration" type="range" min="5" max="60" step="5" value="5">
    <div class="small" id="durHint">מקטע אחד של 5 שניות</div>
    <label>איכות</label>
    <div class="chips" id="quality">
      <button data-v="fast" class="active">⚡ מהיר</button>
      <button data-v="quality">💎 איכותי</button>
    </div>
    <div class="gap"></div>
    <button id="btnVid">🎬 צור סרטון</button>
    <button id="btnCancel" class="sec hidden" style="margin-top:10px">⏹️ בטל יצירה</button>
    <div id="vidProgress" class="hidden">
      <div class="bar"><div id="barFill"></div></div>
      <div class="small" id="progText" style="margin-top:8px"></div>
    </div>
    <div id="vidMsg"></div>
    <div id="vidPreview" class="preview hidden"><video id="vidOut" controls playsinline></video></div>
    <button id="btnVidDl" class="alt hidden" style="margin-top:12px">⬇️ הורד MP4</button>
  </section>
  <p class="small" style="text-align:center">השרת רץ ב-Colab שלכם. השאירו את לשונית ה-Colab פתוחה בזמן העבודה.</p>
</main>

<script>
(function(){
  "use strict";
  var LS_URL = "aiStudio.serverUrl", LS_JOB = "aiStudio.pendingJob";
  var MAX_UPLOAD = 25 * 1024 * 1024;
  var $ = function(id){ return document.getElementById(id); };
  var state = { aspect: "1:1", quality: "fast", imageData: null, srcImage: null, videoUrl: null, jobId: null, polling: false };

  // ---------- כלים ----------
  function showMsg(el, type, text){ $(el).innerHTML = text ? '<div class="msg ' + type + '"></div>' : ""; if (text) $(el).firstChild.textContent = text; }
  function setConn(on, text){ $("statusDot").classList.toggle("on", on); $("statusText").textContent = text || (on ? "מחובר" : "מנותק"); }
  function baseUrl(){
    var u = ($("serverUrl").value || "").trim();
    if (!u) throw new Error("נא להדביק את קישור השרת מ-Colab");
    if (!/^https?:\/\//i.test(u)) u = "https://" + u;
    u = u.replace(/[?#].*$/, "").replace(/\/+$/, "").replace(/\/gradio_api$/, "");
    return u;
  }
  function friendly(err){
    var m = (err && err.message) || String(err);
    if (err && err.name === "AbortError") return "פג הזמן (Timeout): השרת לא הגיב בזמן. ודאו שה-Colab עדיין רץ ונסו שוב.";
    if (/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return "אין חיבור לשרת. ודאו שהקישור נכון, שתא ה-Colab רץ ושיש אינטרנט.";
    if (/HTTP 404/.test(m)) return "השרת לא נמצא (404). ייתכן שהקישור פג תוקף. הפעילו מחדש את ה-Colab והדביקו קישור חדש.";
    if (/HTTP 413/.test(m)) return "הקובץ גדול מדי עבור השרת.";
    if (/HTTP 5\d\d/.test(m)) return "שגיאת שרת. בדקו את פלט ה-Colab ונסו שוב.";
    return m;
  }

  // ---------- לקוח API של Gradio 5 (/gradio_api/call) ----------
  function callApi(name, data, timeoutMs){
    var ctrl = new AbortController();
    var timer = setTimeout(function(){ ctrl.abort(); }, timeoutMs || 30000);
    var base;
    try { base = baseUrl(); } catch(e){ clearTimeout(timer); return Promise.reject(e); }
    return fetch(base + "/gradio_api/call/" + name, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ data: data }), signal: ctrl.signal
    }).then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function(j){
      if (!j || !j.event_id) throw new Error("תגובה לא תקינה מהשרת");
      return fetch(base + "/gradio_api/call/" + name + "/" + j.event_id, { signal: ctrl.signal });
    }).then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    }).then(function(text){
      clearTimeout(timer);
      var blocks = text.split(/\r?\n\r?\n/), result = null, errMsg = null;
      blocks.forEach(function(b){
        var ev = (b.match(/^event:\s*(.*)$/m) || [])[1];
        var dataLine = (b.match(/^data:\s*([\s\S]*)$/m) || [])[1];
        if (ev === "complete") result = JSON.parse(dataLine);
        else if (ev === "error") errMsg = dataLine && dataLine !== "null" ? dataLine : "שגיאה בשרת";
      });
      if (errMsg) throw new Error("שגיאת שרת: " + errMsg);
      if (!result) throw new Error("השרת לא החזיר תוצאה");
      return result;
    }).catch(function(e){ clearTimeout(timer); throw e; });
  }
  function parseJson(s){ var o = typeof s === "string" ? JSON.parse(s) : s; if (!o.ok) throw new Error(o.error || "שגיאה לא ידועה"); return o; }
  function fileUrl(f){
    if (!f) return null;
    var base = baseUrl();
    if (f.path) return base + "/gradio_api/file=" + f.path;
    if (f.url) return f.url.replace(/^http:\/\//, "https://");
    return null;
  }

  // ---------- חיבור ----------
  function checkConnection(silent){
    if (!silent) showMsg("connMsg", "info", "בודק חיבור...");
    return callApi("health", [], 20000).then(function(res){
      var o = parseJson(res[0]);
      setConn(true, o.busy ? "מחובר (עסוק)" : "מחובר");
      showMsg("connMsg", "ok", "✅ מחובר! GPU: " + o.gpu + " | זיכרון: " + o.vram + (o.busy ? " | השרת עסוק כרגע ביצירה" : ""));
      return true;
    }).catch(function(e){
      setConn(false);
      showMsg("connMsg", "err", "❌ " + friendly(e));
      return false;
    });
  }

  // ---------- לשוניות ובוררים ----------
  function switchTab(img){
    $("tabImg").classList.toggle("active", img); $("tabVid").classList.toggle("active", !img);
    $("paneImg").classList.toggle("hidden", !img); $("paneVid").classList.toggle("hidden", img);
  }
  function chips(id, key){
    $(id).addEventListener("click", function(e){
      var b = e.target.closest("button"); if (!b) return;
      Array.prototype.forEach.call($(id).children, function(c){ c.classList.remove("active"); });
      b.classList.add("active"); state[key] = b.getAttribute("data-v");
    });
  }

  // ---------- הורדה / שמירה לגלריה ----------
  function saveBlob(blob, filename){
    try {
      var file = new File([blob], filename, { type: blob.type });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        return navigator.share({ files: [file], title: filename }).catch(function(e){ if (e.name !== "AbortError") downloadLink(blob, filename); });
      }
    } catch(e) {}
    downloadLink(blob, filename);
    return Promise.resolve();
  }
  function downloadLink(blob, filename){
    var u = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }
  function dataUrlToBlob(d){
    var parts = d.split(","), mime = parts[0].match(/:(.*?);/)[1], bin = atob(parts[1]), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }

  // ---------- יצירת תמונה ----------
  function generateImage(){
    var prompt = $("imgPrompt").value.trim();
    if (!prompt) return showMsg("imgMsg", "err", "נא לכתוב תיאור לתמונה");
    $("btnImg").disabled = true; $("btnImg").textContent = "⏳ יוצר תמונה...";
    showMsg("imgMsg", "info", "יוצר תמונה... (בפעם הראשונה זה יכול לקחת עד דקה)");
    callApi("generate_image", [prompt, state.aspect, "-1"], 300000).then(function(res){
      var o = parseJson(res[0]);
      state.imageData = o.image;
      $("imgOut").src = o.image;
      $("imgPreview").classList.remove("hidden"); $("imgActions").classList.remove("hidden");
      showMsg("imgMsg", "ok", "✅ התמונה מוכנה (" + o.width + "×" + o.height + ")");
      setConn(true);
    }).catch(function(e){
      showMsg("imgMsg", "err", "❌ " + friendly(e));
    }).then(function(){ $("btnImg").disabled = false; $("btnImg").textContent = "✨ צור תמונה"; });
  }

  // ---------- טעינת תמונה לסרטון (כולל הקטנה בדפדפן) ----------
  function loadSourceImage(src){
    return new Promise(function(resolve, reject){
      var img = new Image();
      img.onload = function(){
        var max = 1280, w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
        var c = document.createElement("canvas"); c.width = Math.round(w * s); c.height = Math.round(h * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL("image/jpeg", 0.92));
      };
      img.onerror = function(){ reject(new Error("לא ניתן לקרוא את התמונה. נסו קובץ JPG או PNG.")); };
      img.src = src;
    }).then(function(d){
      state.srcImage = d; $("vidSrcImg").src = d;
      $("vidSrcPreview").classList.remove("hidden");
      $("dropZone").textContent = "🔄 לחצו להחלפת התמונה";
      showMsg("vidMsg", "", "");
    });
  }
  function onFile(e){
    var f = e.target.files && e.target.files[0]; if (!f) return;
    if (!/^image\//.test(f.type)) return showMsg("vidMsg", "err", "❌ נא לבחור קובץ תמונה בלבד");
    if (f.size > MAX_UPLOAD) return showMsg("vidMsg", "err", "❌ הקובץ גדול מדי (מעל 25MB). בחרו תמונה קטנה יותר.");
    var url = URL.createObjectURL(f);
    loadSourceImage(url).catch(function(err){ showMsg("vidMsg", "err", "❌ " + err.message); })
      .then(function(){ URL.revokeObjectURL(url); e.target.value = ""; });
  }

  // ---------- יצירת סרטון ומעקב התקדמות ----------
  function setVideoBusy(busy){
    $("btnVid").disabled = busy; $("btnVid").textContent = busy ? "⏳ יוצר סרטון..." : "🎬 צור סרטון";
    $("btnCancel").classList.toggle("hidden", !busy);
    $("vidProgress").classList.toggle("hidden", !busy);
  }
  function startVideo(){
    if (!state.srcImage) return showMsg("vidMsg", "err", "❌ נא לבחור תמונת פתיחה");
    var dur = $("duration").value, prompt = $("vidPrompt").value.trim();
    $("vidPreview").classList.add("hidden"); $("btnVidDl").classList.add("hidden");
    setVideoBusy(true); updateProgress(0, "שולח את הבקשה לשרת...");
    showMsg("vidMsg", "", "");
    callApi("start_video", [state.srcImage, prompt, dur, "-1", state.quality], 90000).then(function(res){
      var o = parseJson(res[0]);
      state.jobId = o.job_id;
      try { localStorage.setItem(LS_JOB, o.job_id); } catch(e) {}
      poll();
    }).catch(function(e){
      setVideoBusy(false);
      showMsg("vidMsg", "err", "❌ " + friendly(e));
    });
  }
  function updateProgress(p, text){ $("barFill").style.width = Math.max(2, p) + "%"; $("progText").textContent = text; }
  function fmt(sec){ var m = Math.floor(sec / 60), s = sec % 60; return m + ":" + (s < 10 ? "0" : "") + s; }
  function poll(){
    if (state.polling) return; state.polling = true;
    var fails = 0;
    (function tick(){
      if (!state.jobId) { state.polling = false; return; }
      callApi("video_status", [state.jobId], 30000).then(function(res){
        fails = 0; setConn(true);
        var o = parseJson(res[0]);
        var seg = o.segment ? "מקטע " + o.segment + " מתוך " + o.total_segments : "";
        updateProgress(o.progress, o.message + " | " + o.progress + "% | זמן: " + fmt(o.elapsed));
        if (o.status === "done") {
          var url = fileUrl(res[1]);
          if (!url) throw new Error("הסרטון נוצר אך לא התקבל קישור לקובץ");
          finishVideo(url); return;
        }
        if (o.status === "error") { endJob(); showMsg("vidMsg", "err", "❌ " + (o.error || "היצירה נכשלה")); return; }
        if (seg) document.title = "(" + o.progress + "%) סטודיו AI";
        setTimeout(tick, 4000);
      }).catch(function(e){
        fails++;
        if (/משימה לא נמצאה/.test(e.message)) { endJob(); showMsg("vidMsg", "err", "❌ " + e.message); return; }
        if (fails >= 8) {
          state.polling = false; setConn(false);
          showMsg("vidMsg", "err", "❌ " + friendly(e) + " המשימה נשמרה. רעננו את הדף לאחר שהחיבור יחזור כדי להמשיך במעקב.");
          return;
        }
        updateProgress(parseFloat($("barFill").style.width) || 0, "החיבור לשרת לא יציב, מנסה שוב... (" + fails + "/8)");
        setTimeout(tick, 5000);
      });
    })();
  }
  function endJob(){
    state.polling = false; state.jobId = null; document.title = "סטודיו AI";
    try { localStorage.removeItem(LS_JOB); } catch(e) {}
    setVideoBusy(false);
  }
  function finishVideo(url){
    endJob();
    state.videoUrl = url;
    $("vidOut").src = url; $("vidPreview").classList.remove("hidden");
    $("btnVidDl").classList.remove("hidden");
    showMsg("vidMsg", "ok", "✅ הסרטון מוכן!");
  }
  function cancelVideo(){
    if (!state.jobId) return;
    $("btnCancel").disabled = true;
    callApi("cancel_video", [state.jobId], 20000).then(function(){ showMsg("vidMsg", "info", "מבטל... המקטע הנוכחי ייעצר בקרוב."); })
      .catch(function(e){ showMsg("vidMsg", "err", "❌ " + friendly(e)); })
      .then(function(){ $("btnCancel").disabled = false; });
  }
  function downloadVideo(){
    if (!state.videoUrl) return;
    var b = $("btnVidDl"); b.disabled = true; b.textContent = "⏳ מוריד...";
    var ctrl = new AbortController(), t = setTimeout(function(){ ctrl.abort(); }, 300000);
    fetch(state.videoUrl, { signal: ctrl.signal }).then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.blob();
    }).then(function(blob){
      return saveBlob(new Blob([blob], { type: "video/mp4" }), "ai-video-" + Date.now() + ".mp4");
    }).catch(function(e){
      showMsg("vidMsg", "err", "❌ ההורדה נכשלה: " + friendly(e) + " אפשר גם ללחוץ לחיצה ארוכה על הסרטון ולבחור 'הורד'.");
    }).then(function(){ clearTimeout(t); b.disabled = false; b.textContent = "⬇️ הורד MP4"; });
  }

  // ---------- אתחול ----------
  try { $("serverUrl").value = localStorage.getItem(LS_URL) || ""; } catch(e) {}
  $("serverUrl").addEventListener("input", function(){ try { localStorage.setItem(LS_URL, $("serverUrl").value.trim()); } catch(e) {} setConn(false); });
  $("btnCheck").addEventListener("click", function(){ checkConnection(false); });
  $("tabImg").addEventListener("click", function(){ switchTab(true); });
  $("tabVid").addEventListener("click", function(){ switchTab(false); });
  chips("aspects", "aspect"); chips("quality", "quality");
  $("btnImg").addEventListener("click", generateImage);
  $("btnImgDl").addEventListener("click", function(){ if (state.imageData) saveBlob(dataUrlToBlob(state.imageData), "ai-image-" + Date.now() + ".jpg"); });
  $("btnToVideo").addEventListener("click", function(){
    if (!state.imageData) return;
    loadSourceImage(state.imageData).then(function(){ switchTab(false); window.scrollTo(0, 0); });
  });
  $("dropZone").addEventListener("click", function(){ $("fileInput").click(); });
  $("fileInput").addEventListener("change", onFile);
  $("duration").addEventListener("input", function(){
    var v = parseInt($("duration").value, 10), n = v / 5;
    $("durVal").textContent = v;
    $("durHint").textContent = (n === 1 ? "מקטע אחד של 5 שניות" : n + " מקטעים של 5 שניות, משורשרים אוטומטית") + " | זמן עיבוד משוער: " + (n * 3) + "-" + (n * 6) + " דקות";
  });
  $("btnVid").addEventListener("click", startVideo);
  $("btnCancel").addEventListener("click", cancelVideo);
  $("btnVidDl").addEventListener("click", downloadVideo);

  if ($("serverUrl").value) {
    checkConnection(true).then(function(on){
      var pending = null; try { pending = localStorage.getItem(LS_JOB); } catch(e) {}
      if (on && pending) { state.jobId = pending; switchTab(false); setVideoBusy(true); updateProgress(0, "ממשיך לעקוב אחר סרטון שהתחיל קודם..."); poll(); }
    });
  }
})();
</script>
</body>
</html>
